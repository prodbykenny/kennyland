<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KENNYLAND 3D · Piazza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap">
<style>

*{box-sizing:border-box}

.bub.on{display:block}
.top{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none}
.tag{background:var(--panel);border:1px solid var(--line);padding:9px 12px;font:10px/1.6 'Press Start 2P',monospace;letter-spacing:.06em;color:var(--acid)}
.tag small{display:block;font:500 12px 'Space Grotesk',sans-serif;letter-spacing:0;color:var(--muted);margin-top:3px}
.right{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
.right a,.right button,.btns button{font:700 12px 'Space Grotesk',sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 11px;cursor:pointer;text-decoration:none}
.right a:hover,.right button:hover,.btns button:hover{border-color:var(--acid);color:var(--acid)}
.coin{background:var(--panel);border:1px solid var(--line);padding:8px 11px;font:700 12px 'Space Grotesk',sans-serif;color:#ffd23d}
.btns{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
#chat{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
#chat input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--violet);color:var(--ink);padding:11px 12px;font:500 14px 'Space Grotesk',sans-serif}
#chat button{background:var(--panel);border:1px solid var(--violet);color:var(--acid);width:46px;font-size:18px;cursor:pointer}
#log{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));max-width:min(340px,70vw);font-size:12px;line-height:1.4;pointer-events:none;display:flex;flex-direction:column;gap:2px}
#log div{background:rgba(10,6,22,.72);padding:3px 8px}#log b{color:var(--muted)}#log b.own{color:var(--acid)}
#banner{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(560px,90vw);background:var(--panel);border:1px solid var(--violet);padding:9px 14px;font-size:14px;display:none;text-align:center}
#banner.on{display:block}

#guest{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--violet);padding:11px 16px;font-size:13px;text-align:center;max-width:92vw}

.mod{position:fixed;inset:0;z-index:90;background:rgba(5,3,12,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.card{position:relative;width:min(380px,100%);background:#0a0414;border:1px solid var(--line);box-shadow:0 0 40px rgba(123,47,255,.35);padding:24px 22px 20px}

.card p{margin:0 0 12px;font-size:13px;color:var(--muted)}

.card.wide{width:min(720px,100%);max-height:88vh;overflow:auto}
.cork{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin:6px 0 12px;padding:14px;background:#2a1f14}
.note{background:#fbf7e8;color:#241c10;padding:10px 12px;font-size:13px;line-height:1.4;min-width:0}
.note .nk{display:inline-block;color:#fff;font:700 9px 'Space Grotesk',sans-serif;letter-spacing:.1em;padding:2px 6px;margin-bottom:6px}
.note h5{margin:0 0 4px;font:900 15px 'Playfair Display',serif}.note p{margin:0 0 6px;word-break:break-word;color:#241c10;font-size:13px}.note img{width:100%;display:block;margin-bottom:6px}
.note a{display:block;color:#5b24c7;margin-bottom:6px;word-break:break-all}.note .nf{font-size:11px;color:#6a5f46;display:flex;justify-content:space-between;gap:6px}.note .nf button{border:0;background:none;color:#a02020;text-decoration:underline;cursor:pointer;font:inherit}
.empty{grid-column:1/-1;color:#d9cfae;font-size:13px}
.card details{margin-top:6px}.card summary{cursor:pointer;color:var(--acid);font-weight:700;font-size:13px;margin-bottom:8px}.card label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.card input,.card select{display:block;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:8px 10px;font:500 14px 'Space Grotesk',sans-serif;margin-top:3px}
.x{position:absolute;top:8px;right:10px;background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:16px}
.wmsg{min-height:20px;font-size:13px;color:var(--red);margin-bottom:8px}
.go{width:100%;background:var(--acid);color:#04140c;border:0;padding:12px;font:900 13px 'Playfair Display',serif;letter-spacing:.14em;cursor:pointer}
.go:disabled{opacity:.55;cursor:default}
#fade{position:fixed;inset:0;background:#05030c;opacity:0;pointer-events:none;transition:opacity .18s;z-index:80}#fade.on{opacity:1}
@media (max-width:560px){.hint{display:none}}

[[4, 6, 13, 6.04, 0], [7.5, 6, 7.54, 8.4, 0], [9.5, 6, 9.54, 8.4, 0], [7.5, 8.4, 9.5, 8.44, 0], [13, 0, 13.04, 6, 0], [4, 0, 4.04, 6, 0]].forEach(function(e){ box(Math.max(e[2] - e[0], .05), .05, Math.max(e[3] - e[1], .05), NEON, (e[0] + e[2]) / 2, SH + .01, (e[1] + e[3]) / 2); });

function bigSpeaker(x, z){

(async function(){
  if(!sb){ toast('Servizio non disponibile.'); return; }
  var ses = null; try{ var r = await sb.auth.getSession(); ses = r && r.data && r.data.session; }catch(e){}
  if(ses && ses.user){
    ME.uid = ses.user.id;
    try{ var p = await sb.from('profiles').select('nickname,avatar').eq('id', ME.uid).maybeSingle(); ME.nick = cleanNick(p && p.data && p.data.nickname); ME.av = (p && p.data && p.data.avatar) || null; }catch(e){}
    if(!ME.av){ try{ ME.av = JSON.parse(localStorage.getItem('kl_avatar') || 'null'); }catch(e){} }
    try{ var ad = await sb.rpc('is_kl_admin'); ME.owner = !!(ad && ad.data === true); }catch(e){}
    try{ var w = await sb.from('wallets').select('coins').eq('user_id', ME.uid).maybeSingle(); if(w && w.data) $('coins').textContent = w.data.coins; }catch(e){}
    ME.ready = !!ME.nick && ME.nick !== '?'; dressAv(ME.A, ME.av, ME.owner);
  }

  else { scene.remove(ME.A.g); $('guest').hidden = false; }
  window.kl3d = {enter:enterScene, cs:cs, ME:ME, goAct:goAct, doAct:doAct};

})();
