var SHOP = (function(){
  var cat = null, price = {}, ov = null, busy = false;
  function coinsNow(){ return parseInt($('coins').textContent, 10) || 0; }
  function setCoins(n){ CH.setCoins(n); }
  async function load(){
    try{ var c = await sb.from('shop_catalog').select('id,price,active'); if(c && c.data) c.data.forEach(function(r){ if(r.active) price[r.id] = r.price; }); }catch(e){}
    Object.keys(PRICE).forEach(function(k){ if(price[k] === undefined && !Object.keys(price).length) price[k] = PRICE[k]; });
    try{ var q = await sb.from('inventory').select('item_id'); INV.own = {}; if(q && q.data) q.data.forEach(function(r){ INV.own[r.item_id] = 1; }); INV.loaded = true; }catch(e){}
  }
  function render(){
    if(!ov) return; var C = CATS.filter(function(x){ return true; });
    var tabs = C.map(function(c){ return '<button type="button" class="sh-tab' + (c.id === cat ? ' on' : '') + (c.soon ? ' soon' : '') + '" data-c="' + c.id + '">' + c.name + '</button>'; }).join('');
    var cur = CATS.filter(function(c){ return c.id === cat; })[0], body = '';
    if(cur && cur.soon) body = '<div class="sh-soon">Presto: ' + esc(cur.soon) + '</div>';
    else (ITEM_ORDER[cat] || []).forEach(function(id){
      var it = ITEMS[id], p = price[id], own = INV.own[id], img = THUMB.get(id);
      if(p === undefined) return;
      body += '<div class="sh-card' + (own ? ' own' : '') + '"><div class="sh-img">' + (img ? '<img alt="" src="' + img + '">' : '<span>' + (it.skill === 'dance' ? '💃' : '🚶') + '</span>') + '</div><div class="sh-n">' + esc(it.name) + '</div><div class="sh-d">' + esc(it.desc || '') + '</div><div class="sh-b">' + (own ? '<span class="sh-ok">✓ Tuo</span>' : '<button type="button" class="sh-buy" data-id="' + id + '">🪙 ' + p + '</button>') + '</div></div>';
    });
    ov.querySelector('.sh-tabs').innerHTML = tabs; ov.querySelector('.sh-grid').innerHTML = body; ov.querySelector('.sh-coins').textContent = '🪙 ' + coinsNow();
  }
  async function buy(id){
    if(busy) return; busy = true;
    try{
      var r = await sb.rpc('shop_buy', {p_item:id}), d = r && r.data && (Array.isArray(r.data) ? r.data[0] : r.data), res = d && d.res;
      if(r.error || !d) toast('Acquisto non riuscito, riprova.');

      else if(res === 'owned'){ INV.own[id] = 1; toast('Ce l\'hai già.'); }
      else if(res === 'poor'){ if(d.total_coins !== undefined && d.total_coins !== null) setCoins(d.total_coins); toast('Servono più monete: ' + price[id] + ' 🪙'); }
      else toast('Oggetto non disponibile.');
    }catch(e){ toast('Acquisto non riuscito, riprova.'); }
    busy = false; render();
  }
  async function open(){
    if(!ME.ready) return toast('Accedi dal sito per usare il negozio.');
    CH.mission('open_shop');
    if(ov) return;
    ov = document.createElement('div'); ov.className = 'world-modal sh-modal';
    ov.innerHTML = '<div class="world-card sh-card-main"><button type="button" class="world-x" aria-label="Chiudi">✕</button><h4>NEGOZIO</h4><div class="sh-coins"></div><div class="sh-tabs"></div><div class="sh-grid"><div class="sh-soon">Carico…</div></div></div>';
    document.body.appendChild(ov);
    function close(){ if(ov && ov.parentNode) ov.parentNode.removeChild(ov); ov = null; }
    ov.querySelector('.world-x').addEventListener('click', close);
    ov.addEventListener('click', function(e){
      if(e.target === ov) return close();
      var t = e.target.closest ? e.target.closest('[data-c]') : null; if(t){ cat = t.getAttribute('data-c'); render(); return; }
      var b = e.target.closest ? e.target.closest('.sh-buy') : null; if(b) buy(b.getAttribute('data-id'));
    });
    cat = cat || 'tech';
    await load(); render();
  }
  return {open:open, price:price};
})();

  async function refreshStats(){ try{ var u = await sb.from('user_stats').select('key,value'); if(u && !u.error && u.data){ var n = {}; u.data.forEach(function(x){ n[x.key] = Number(x.value); }); Object.keys(Q).forEach(function(k){ n[k] = (n[k] || 0) + Q[k]; }); U = n; } }catch(e){} paintLevel(); }
  async function loadMissions(){ try{ var r = await sb.rpc('my_missions'); if(r && !r.error && r.data){ missions = r.data; misDay = today(); } }catch(e){} paint(); }
  async function counts(){
    try{ var r = await sb.from('profiles').select('id', {count:'exact', head:true}); if(r && !r.error && r.count !== null) $('mCount').textContent = r.count; }catch(e){}
  }
  function online(){
    try{ var oc = sb.channel('kl-online', {config:{presence:{key:'v' + Math.random().toString(36).slice(2)}}});
      oc.on('presence', {event:'sync'}, function(){ $('oCount').textContent = Object.keys(oc.presenceState()).length; });
      oc.subscribe(function(st){ if(st === 'SUBSCRIBED'){ try{ oc.track({t:Date.now()}); }catch(e){} } }); }catch(e){}
  }
  async function setNews(v){ try{ var r = await sb.from('profile_prefs').upsert({id:ME.uid, news_optin:v}); return !(r && r.error); }catch(e){ return false; } }
  async function init(){
    counts(); online(); setInterval(counts, 30000);
    if(!ME.ready) return; if(loaded) return; loaded = true;
    $('hudw').hidden = false;
    try{ var w = await sb.from('wallets').select('coins,streak,last_claim').eq('user_id', ME.uid).maybeSingle(); if(w && w.data) wallet = w.data; $('coins').textContent = wallet.coins; }catch(e){}
    try{ var s = await sb.auth.getSession(); uEmail = s && s.data && s.data.session && s.data.session.user.email || ''; }catch(e){} $('aEmail').textContent = uEmail; $('aNick').textContent = ME.nick;
    try{ var pr = await sb.from('profile_prefs').select('news_optin').eq('id', ME.uid).maybeSingle(); $('aNews').checked = !!(pr && pr.data && pr.data.news_optin); }catch(e){}
    paint(); await refreshStats(); await loadMissions();
    setInterval(function(){ if(misDay && misDay !== today()) loadMissions(); paint(); }, 60000);
  }
  $('hudCard').onclick = function(){ var p = $('hudPop'); p.hidden = !p.hidden; this.setAttribute('aria-expanded', p.hidden ? 'false' : 'true'); };
  $('hClaim').onclick = claim; $('hShop').onclick = function(){ $('hudPop').hidden = true; SHOP.open(); };
  $('aNews').onchange = async function(){ var el = this, ok = await setNews(el.checked); $('aMsg').textContent = ok ? 'Preferenza salvata.' : 'Non sono riuscito a salvare, riprova.'; if(!ok) el.checked = !el.checked; };
  $('aOut').onclick = async function(e){ e.preventDefault(); try{ await sb.auth.signOut(); }catch(x){} location.reload(); };
  $('aDel').onclick = async function(){ if(!confirm('Eliminare il tuo account? Profilo, avatar e preferenze spariscono per sempre.')) return; try{ var r = await sb.rpc('delete_my_account'); if(r.error){ $('aMsg').textContent = "Non sono riuscito a eliminare l'account, riprova."; return; } try{ await sb.auth.signOut({scope:'local'}); }catch(x){} location.reload(); }catch(e){ $('aMsg').textContent = "Non sono riuscito a eliminare l'account, riprova."; } };
  document.querySelectorAll('.soc a').forEach(function(a){ a.addEventListener('click', function(){ var h = a.getAttribute('href') || ''; track(h.indexOf('spotify') > -1 ? 'click_spotify' : h.indexOf('soundcloud') > -1 ? 'click_soundcloud' : 'click_page'); }); });
  new MutationObserver(function(){ var n = parseInt($('coins').textContent, 10); if(isFinite(n) && n !== wallet.coins){ wallet.coins = n; paint(); } }).observe($('coins'), {childList:true, characterData:true, subtree:true});
  // ascolto: missione "ascolta un brano" quando la musica audible gira per qualche secondo
  var lt = 0; setInterval(function(){ if(!ME.ready) return; var hear = (CUR.name === 'plaza' && dj.playing && !dj.muted) || (CUR.name === 'home' && homeMusic && dj.playing); lt = hear ? lt + 1 : 0; if(lt === 5){ mission('listen_any'); track('listen_player'); } }, 1000);
  return {init:init, track:track, mission:mission, setCoins:setCoins, paint:paint};
})();
window.klMission = CH.mission;

// ======================= ACCESSO / REGISTRAZIONE (link via email, niente password) =======================
var AUTH = (function(){
  var ov = null, mode = 'signup', DEF_AV = {shirt:'#ffffff', pants:'#ffffff', shoes:'#ffffff', hair:'#ffffff', cap:'#ffffff', glasses:'#3dffa0', phones:'#7b2fff', hairStyle:'short', barefoot:true, outer:false, accs:[]};
  function validNick(n){ return /^[A-Za-z0-9_.-]{3,20}$/.test(n); }
  async function nickTaken(n){ var r = await sb.from('profiles').select('id', {count:'exact', head:true}).ilike('nickname', n.replace(/_/g, '\\_')); return (r.count || 0) > 0; }
  async function setNews(v){ try{ var r = await sb.from('profile_prefs').upsert({id:ME.uid, news_optin:v, news_optin_at:v ? new Date().toISOString() : null}); return !(r && r.error); }catch(e){ return false; } }
  function close(){ if(ov && ov.parentNode) ov.parentNode.removeChild(ov); ov = null; }
  function open(m){
    mode = m || 'signup'; if(!sb) return toast('Servizio non disponibile.');
    var only = mode === 'nickonly', login = mode === 'login';
    if(!ov){ ov = document.createElement('div'); ov.className = 'mod'; document.body.appendChild(ov); ov.addEventListener('click', function(e){ if(e.target === ov && mode !== 'nickonly') close(); }); }
    ov.innerHTML = '<div class="card"><button type="button" class="x" aria-label="Chiudi"' + (only ? ' style="display:none"' : '') + '>✕</button>' +
      (only ? '' : '<div class="lg-tabs"><button type="button" class="lg-t' + (login ? '' : ' on') + '" data-m="signup">Registrati</button><button type="button" class="lg-t' + (login ? ' on' : '') + '" data-m="login">Accedi</button></div>') +
      '<h4>' + (only ? 'Scegli il tuo nickname' : login ? 'Bentornato in KENNYLAND' : 'Benvenuto in KENNYLAND') + '</h4>' +
      '<p>' + (only ? 'Accesso confermato: manca solo il nome con cui ti vedranno gli altri.' : login ? 'Scrivi la tua email: ti mandiamo un nuovo link per rientrare.' : 'Scegli un nickname e inserisci la tua email: ti mandiamo un link per entrare, niente password.') + '</p>' +
      (login ? '' : '<input id="lgNick" class="lg-in" maxlength="20" placeholder="Nickname" autocomplete="nickname">') + (only ? '' : '<input id="lgMail" class="lg-in" type="email" placeholder="La tua email" autocomplete="email">') +
      ((only || login) ? '' : '<label class="lg-ck"><input type="checkbox" id="lgCons"><span>Ho almeno 14 anni e acconsento all\'uso della mia email per accedere a KENNYLAND. <a href="privacy.html" target="_blank" rel="noopener">Informativa privacy</a></span></label>') +
      (login ? '' : '<label class="lg-ck"><input type="checkbox" id="lgNews"><span>Avvisami via email quando esce un nuovo drop! (se non mi clicchi sei un bufu!)</span></label>') +
      '<div class="wmsg" id="lgMsg"></div><button type="button" class="go" id="lgGo">' + (only ? 'Conferma' : login ? 'Mandami il link' : 'Invia il link') + '</button></div>';
    var x = ov.querySelector('.x'); if(x) x.onclick = close;
    Array.prototype.forEach.call(ov.querySelectorAll('.lg-t'), function(b){ b.onclick = function(){ open(b.getAttribute('data-m')); }; });
    ov.querySelector('#lgGo').onclick = submit;
  }
  async function submit(){
    var go = ov.querySelector('#lgGo'), msg = function(t){ ov.querySelector('#lgMsg').textContent = t || ''; }; go.disabled = true; msg('Un attimo...');
    var $v = function(id){ var e = ov.querySelector('#' + id); return e ? e.value.trim() : ''; }, redir = location.origin + location.pathname;
    try{
      if(mode === 'login'){
        var le = $v('lgMail'); if(!/^\S+@\S+\.\S+$/.test(le)){ msg("Inserisci un'email valida."); return; }
        var lr = await sb.auth.signInWithOtp({email:le, options:{shouldCreateUser:false, emailRedirectTo:redir}});
        if(lr.error){ msg(/signups not allowed|not found/i.test(lr.error.message) ? 'Non trovo questa email. Se è la prima volta, passa a Registrati.' : 'Non riesco a inviare il link: ' + lr.error.message); return; }
        msg('Link inviato! Controlla la tua email (anche lo spam) e clicca per rientrare.'); go.style.display = 'none'; return;
      }
      var nick = $v('lgNick'); if(!validNick(nick)){ msg('Nickname: da 3 a 20 caratteri tra lettere, numeri, _ . -'); return; }
      if(await nickTaken(nick)){ msg(mode === 'signup' ? 'Nickname già preso. Se è il tuo, passa ad Accedi.' : 'Nickname già preso, scegline un altro.'); return; }
      if(mode === 'nickonly'){
        var ins = await sb.from('profiles').insert({id:ME.uid, nickname:nick, avatar:DEF_AV});
        if(ins.error){ msg(ins.error.code === '23505' ? 'Nickname già preso, scegline un altro.' : 'Errore nel salvataggio, riprova.'); return; }
        var nw = ov.querySelector('#lgNews'); if(nw && nw.checked) await setNews(true);
        location.reload(); return;
      }
      var email = $v('lgMail'); if(!/^\S+@\S+\.\S+$/.test(email)){ msg("Inserisci un'email valida."); return; }
      if(!ov.querySelector('#lgCons').checked){ msg('Serve confermare età e consenso.'); return; }
      try{ localStorage.setItem('kl_pending_nick', nick); localStorage.setItem('kl_pending_news', ov.querySelector('#lgNews').checked ? '1' : '0'); }catch(e){}
      var r = await sb.auth.signInWithOtp({email:email, options:{emailRedirectTo:redir}});
      if(r.error){ msg('Non riesco a inviare il link: ' + r.error.message); return; }
      msg('Link inviato! Controlla la tua email (anche lo spam) e clicca per entrare.'); go.style.display = 'none';
    }catch(e){ msg('Qualcosa non ha funzionato, riprova.'); }
    finally{ go.disabled = false; }
  }
  // dopo il click sul link: profilo mancante -> usa il nickname salvato, altrimenti chiedilo
  async function afterSession(uid){
    var pend = null; try{ pend = localStorage.getItem('kl_pending_nick'); }catch(e){}
    if(pend && validNick(pend)){
      var ins = await sb.from('profiles').insert({id:uid, nickname:pend, avatar:DEF_AV});
      if(!ins.error){ try{ localStorage.removeItem('kl_pending_nick'); }catch(e){} var pn = null; try{ pn = localStorage.getItem('kl_pending_news'); }catch(e){} ME.uid = uid; if(pn === '1') await setNews(true); try{ localStorage.removeItem('kl_pending_news'); }catch(e){} location.reload(); return; }
    }
    ME.uid = uid; open('nickonly');
  }
  return {open:open, afterSession:afterSession};
})();

// ---- avvio: sessione condivisa con il sito (stesso dominio), profilo, canale
(async function(){
  if(!sb){ toast('Servizio non disponibile.'); return; }
  var ses = null; try{ var r = await sb.auth.getSession(); ses = r && r.data && r.data.session; }catch(e){}
  var noProfile = false;
  if(ses && ses.user){
    ME.uid = ses.user.id;
    try{ var p = await sb.from('profiles').select('nickname,avatar').eq('id', ME.uid).maybeSingle(); ME.nick = cleanNick(p && p.data && p.data.nickname); ME.av = (p && p.data && p.data.avatar) || null; if(p && !p.error && !p.data) noProfile = true; }catch(e){}
    if(!ME.av){ try{ ME.av = JSON.parse(localStorage.getItem('kl_avatar') || 'null'); }catch(e){} }
    try{ var ad = await sb.rpc('is_kl_admin'); ME.owner = !!(ad && ad.data === true); }catch(e){}
    try{ var w = await sb.from('wallets').select('coins').eq('user_id', ME.uid).maybeSingle(); if(w && w.data) $('coins').textContent = w.data.coins; }catch(e){}
    ME.ready = !!ME.nick && ME.nick !== '?'; dressAv(ME.A, ME.av, ME.owner);
  }
  CH.init();
  if(ME.ready){ meLabel = {el:mkLabel(ME.nick, ME.owner), bt:0}; $('who').textContent = ME.nick; $('coinbox').hidden = false; $('chat').hidden = false; ME.A.g.position.set(ME.x, 0, ME.z); }
  else { scene.remove(ME.A.g); $('guest').hidden = false; $('gEnter').onclick = function(){ var had = false; try{ had = !!localStorage.getItem('kl_has_account'); }catch(e){} AUTH.open(noProfile ? 'nickonly' : (had ? 'login' : 'signup')); }; if(noProfile) AUTH.afterSession(ME.uid); }
  if(ME.ready){ try{ localStorage.setItem('kl_has_account', '1'); }catch(e){} }
  window.kl3d = {dress:function(a){ ME.A.sig = ''; dressAv(ME.A, a, ME.owner); }, enter:enterScene, cs:cs, ME:ME, goAct:goAct, doAct:doAct};
  joinChannel('kl-room-plaza'); djPull(); setInterval(djPull, 20000);
  try{ var q = await sb.from('wheel_spins').select('slot').eq('day', wheelDay()).maybeSingle(); wheelUsed = !!(q && q.data); }catch(e){}
})();
})();
</script></body></html>
