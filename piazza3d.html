<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KENNYLAND 3D · Piazza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#0a0a12;--ink:#e9e6f5;--muted:#8d88a8;--acid:#3dffa0;--violet:#7b2fff;--red:#ff3b3b;--panel:rgba(10,6,22,.82);--line:#3a2a66}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.nm{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform}
.nm span{font:700 11px 'Space Grotesk',sans-serif;color:var(--ink);background:rgba(10,6,22,.7);padding:2px 7px;border:1px solid var(--line)}
.nm.own span{color:var(--acid);border-color:var(--acid)}
.bub{display:none;max-width:200px;background:#fff;color:#14101c;font:500 12px 'Space Grotesk',sans-serif;padding:5px 9px;line-height:1.3;word-break:break-word}
.bub.on{display:block}
.top{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none}
.tag{background:var(--panel);border:1px solid var(--line);padding:9px 12px;font:10px/1.6 'Press Start 2P',monospace;letter-spacing:.06em;color:var(--acid)}
.tag small{display:block;font:500 12px 'Space Grotesk',sans-serif;letter-spacing:0;color:var(--muted);margin-top:3px}
.right{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
.right a,.right button,.btns button{font:700 12px 'Space Grotesk',sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 11px;cursor:pointer;text-decoration:none}
.right a:hover,.right button:hover,.btns button:hover{border-color:var(--acid);color:var(--acid)}
.coin{background:var(--panel);border:1px solid var(--line);padding:8px 11px;font:700 12px 'Space Grotesk',sans-serif;color:#ffd23d}
.btns{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
#chat{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
#chat input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--violet);color:var(--ink);padding:11px 12px;font:500 14px 'Space Grotesk',sans-serif}
#chat button{background:var(--panel);border:1px solid var(--violet);color:var(--acid);width:46px;font-size:18px;cursor:pointer}
#log{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));max-width:min(340px,70vw);font-size:12px;line-height:1.4;pointer-events:none;display:flex;flex-direction:column;gap:2px}
#log div{background:rgba(10,6,22,.72);padding:3px 8px}#log b{color:var(--muted)}#log b.own{color:var(--acid)}
#banner{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(560px,90vw);background:var(--panel);border:1px solid var(--violet);padding:9px 14px;font-size:14px;display:none;text-align:center}
#banner.on{display:block}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:9px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center;max-width:90vw}
#toast.on{opacity:1}
#guest{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--violet);padding:11px 16px;font-size:13px;text-align:center;max-width:92vw}
#guest a{color:var(--acid)}
.mod{position:fixed;inset:0;z-index:90;background:rgba(5,3,12,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.card{position:relative;width:min(380px,100%);background:#0a0414;border:1px solid var(--line);box-shadow:0 0 40px rgba(123,47,255,.35);padding:24px 22px 20px}
.card h4{margin:0 0 8px;font:900 18px 'Playfair Display',serif;letter-spacing:.14em;color:var(--red)}
.card p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.card textarea{display:block;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px 12px;font:500 14px 'Space Grotesk',sans-serif;margin-bottom:10px}
.card.wide{width:min(720px,100%);max-height:88vh;overflow:auto}
.cork{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin:6px 0 12px;padding:14px;background:#2a1f14}
.note{background:#fbf7e8;color:#241c10;padding:10px 12px;font-size:13px;line-height:1.4;min-width:0}
.note .nk{display:inline-block;color:#fff;font:700 9px 'Space Grotesk',sans-serif;letter-spacing:.1em;padding:2px 6px;margin-bottom:6px}
.note h5{margin:0 0 4px;font:900 15px 'Playfair Display',serif}.note p{margin:0 0 6px;word-break:break-word;color:#241c10;font-size:13px}.note img{width:100%;display:block;margin-bottom:6px}
.note a{display:block;color:#5b24c7;margin-bottom:6px;word-break:break-all}.note .nf{font-size:11px;color:#6a5f46;display:flex;justify-content:space-between;gap:6px}.note .nf button{border:0;background:none;color:#a02020;text-decoration:underline;cursor:pointer;font:inherit}
.empty{grid-column:1/-1;color:#d9cfae;font-size:13px}
.card details{margin-top:6px}.card summary{cursor:pointer;color:var(--acid);font-weight:700;font-size:13px;margin-bottom:8px}.card label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.card input,.card select{display:block;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:8px 10px;font:500 14px 'Space Grotesk',sans-serif;margin-top:3px}
.x{position:absolute;top:8px;right:10px;background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:16px}
.wmsg{min-height:20px;font-size:13px;color:var(--red);margin-bottom:8px}
.go{width:100%;background:var(--acid);color:#04140c;border:0;padding:12px;font:900 13px 'Playfair Display',serif;letter-spacing:.14em;cursor:pointer}
.go:disabled{opacity:.55;cursor:default}
@media (max-width:560px){.hint{display:none}}

(function(){

  var e1 = new THREE.Mesh(new THREE.PlaneGeometry(24, .35), new THREE.MeshStandardMaterial({color:0x4a4562})); e1.rotation.x = -Math.PI / 2; e1.position.set(12, .012, .175); scene.add(e1);

})();

// ---- ostacoli per le collisioni (AABB su x,z)
var OB = []; function ob(x0, z0, x1, z1){ OB.push([x0, z0, x1, z1]); }
var NEON = glow(0x3dffa0), VIO = glow(0x7b2fff);

// ---- palco rialzato, passerella, scaletta
var SH = .75, stageMat = M(0x1b1233, {roughness:.4, metalness:.4});

[[4, 6, 13, 6.04, 0], [7.5, 6, 7.54, 8.4, 0], [9.5, 6, 9.54, 8.4, 0], [7.5, 8.4, 9.5, 8.44, 0], [13, 0, 13.04, 6, 0], [4, 0, 4.04, 6, 0]].forEach(function(e){ box(Math.max(e[2] - e[0], .05), .05, Math.max(e[3] - e[1], .05), NEON, (e[0] + e[2]) / 2, SH + .01, (e[1] + e[3]) / 2); });
// due scalette (sinistra e destra): 3 gradini + alzata finale, con bordo luminoso e corrimano
var stairMat = M(0x6a56b8, {roughness:.5, metalness:.1, emissive:0x2a1f5a}), railMat = M(0xdfe3f5, {roughness:.4, metalness:.1, emissive:0x6a6f88});
function stairs(dir){ // +1 destra (x 13 -> 14.5), -1 sinistra (x 4 -> 2.5)
  for(var k = 1; k <= 3; k++){ var h = SH * k / 4, cx = dir > 0 ? (14.5 - k * .5 + .25) : (2.5 + (k - 1) * .5 + .25);
    box(.5, h, 1.3, stairMat, cx, h / 2, 3.5);
    box(.05, .02, 1.3, NEON, dir > 0 ? cx + .225 : cx - .225, h + .01, 3.5);
    box(.5, .02, .05, NEON, cx, h + .01, 2.85); box(.5, .02, .05, NEON, cx, h + .01, 4.15);
  }
  var xs = dir > 0 ? [14.5, 13] : [2.5, 4];
  [2.8, 4.2].forEach(function(z){
    [0, 1].forEach(function(i){ var top = i ? .75 : .1875; box(.06, top + .75, .06, railMat, xs[i], (top + .75) / 2, z); });
    var len = Math.hypot(1.5, SH * .75), r = new THREE.Mesh(new THREE.BoxGeometry(len, .05, .05), railMat); r.position.set((xs[0] + xs[1]) / 2, (.1875 + .75 + .75 + .75) / 2, z); r.rotation.z = (dir > 0 ? -1 : 1) * Math.atan2(SH * .75, 1.5); scene.add(r);

stairs(1); stairs(-1);
ob(3.7, -1, 4.0, 3); ob(3.7, 4, 4.0, 6.3); ob(4, 6, 7.5, 6.3); ob(9.5, 6, 13, 6.3); ob(7.3, 6.2, 7.6, 8.7); ob(9.4, 6.2, 9.7, 8.7); ob(7.3, 8.5, 9.7, 8.8); ob(13, -1, 13.3, 3); ob(13, 4, 13.3, 6.3);
function stageH(x, z){
  if(x > 4 && x < 13 && z > -1 && z < 6) return SH;
  if(x > 7.5 && x < 9.5 && z >= 6 && z < 8.4) return SH;
  if(z > 3 && z < 4){ if(x >= 13 && x < 14.5) return SH * (3 - Math.floor((x - 13) / .5)) / 4; if(x > 2.5 && x <= 4) return SH * (1 + Math.floor((x - 2.5) / .5)) / 4; }

// LED screen
var led = (function(){ var t = tex(1024, 406, function(g, W, H){ g.fillStyle = '#07050f'; g.fillRect(0, 0, W, H); g.strokeStyle = '#ffffff'; g.lineWidth = 8; g.strokeRect(8, 8, W - 16, H - 16); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = '#b18cff'; g.shadowBlur = 24; var f = 150; g.font = '900 ' + f + 'px "Playfair Display",Georgia,serif'; var w = g.measureText('KENNYLAND').width; f = Math.floor(f * (W * .84) / w); g.font = '900 ' + f + 'px "Playfair Display",Georgia,serif'; g.fillText('KENNYLAND', W / 2, H * .38); var f2 = Math.floor(f * .62); g.font = '900 ' + f2 + 'px "Playfair Display",Georgia,serif'; g.fillStyle = '#ff3b3b'; g.shadowColor = '#ff3b3b'; g.fillText('LIVE', W / 2, H * .75); }); return new THREE.Mesh(new THREE.PlaneGeometry(8.6, 3.4), new THREE.MeshBasicMaterial({map:t})); })(); led.position.set(8.5, SH + 2.6, .35); scene.add(led);

// console DJ
box(6.1, .9, 1.4, M(0x1b1526), 8.5, SH + .45, 2.7); ob(5.4, 2, 11.6, 3.4);
box(6, .08, 1.3, M(0x0c0818), 8.5, SH + .92, 2.7);
[[6.3, 0], [10.7, 1]].forEach(function(t){ cyl(.4, .06, M(0x9aa0b8, {metalness:.8}), t[0], SH + 1, 2.7); cyl(.34, .05, M(0x08060f), t[0], SH + 1.04, 2.7); });
[7.3, 8.1, 9.6, 10.2].forEach(function(x, i){ cyl(.24, .05, M(0x0d0a16), x, SH + 1.0, 2.9); var l = box(.05, .05, .05, glow(i % 2 ? 0xb57bff : 0x3dffa0), x, SH + 1.05, 2.9); });
var dj = sign('OMG KENNY!', 5.2, .5, '#3dffa0', '#0a0612', '900 54px "Playfair Display",Georgia,serif'); dj.position.set(8.5, SH + .42, 3.41); scene.add(dj);
// traliccio e luci
box(4.6, .12, .12, M(0x2a2438), 8.5, SH + 4.4, .8); [6.3, 10.7].forEach(function(x){ box(.12, 4.4, .12, M(0x2a2438), x, SH + 2.2, .8); });
var spots = [6.9, 8.1, 9.3, 10.3].map(function(x, i){ var s = new THREE.SpotLight(i % 2 ? 0xb57bff : 0x3dffa0, 2.2, 14, .38, .5, 1); s.position.set(x, SH + 4.3, .9); s.target.position.set(x, SH, 4); scene.add(s, s.target); box(.18, .18, .18, glow(i % 2 ? 0xb57bff : 0x3dffa0), x, SH + 4.3, .9); return s; });
// microfono sulla passerella
cyl(.18, .04, M(0x0a0812), 8.5, SH + .02, 8); cyl(.02, 1.9, M(0x8a8fa8, {metalness:.8}), 8.5, SH + .95, 8); cyl(.05, .16, M(0x15111f), 8.5, SH + 1.95, 7.84, scene, 12);
// casse giganti
function bigSpeaker(x, z){
  var tiers = [[0, 3, 1.8], [3, 5.2, 1.6], [5.2, 7.4, 1.35]];
  tiers.forEach(function(t, k){
    var w = t[2], h = t[1] - t[0]; box(w, h, w, M(0x15101f, {roughness:.55}), x, t[0] + h / 2, z);
    [0, 1].forEach(function(side){
      var rads = k === 2 ? [[.3, .55], [.3, -.55]] : [[(k === 0 ? .68 : .56) * w / 2, 0]];
      rads.forEach(function(rr){
        var g = new THREE.Group(); g.add(new THREE.Mesh(new THREE.TorusGeometry(rr[0], .035, 8, 28), NEON));

  var open = [s], gs = {}, came = {}, cl = {}, k0 = s[1] * NG + s[0], found = false, guard = 0; gs[k0] = 0;

    for(var dx2 = -1; dx2 <= 1; dx2++) for(var dy2 = -1; dy2 <= 1; dy2++){

      if(dx2 && dy2 && (!free(cur[0] + dx2, cur[1]) || !free(cur[0], cur[1] + dy2))) continue;
      var nk = ny * NG + nx; if(cl[nk]) continue; var tg = gs[ck] + (dx2 && dy2 ? 1.41 : 1);
      if(gs[nk] === undefined || tg < gs[nk]){ gs[nk] = tg; fs[nk] = tg + h(nx, ny); came[nk] = ck; if(!open.some(function(o){ return o[0] === nx && o[1] === ny; })) open.push([nx, ny]); }
    }

  var cells = [], kk = g[1] * NG + g[0]; while(kk !== undefined && kk !== k0){ cells.unshift({x:kk % NG + .5, z:Math.floor(kk / NG) + .5}); kk = came[kk]; }

  return res;
}

  Object.keys(st).forEach(function(k){

var KIND = {promo:['PROMO', '#7b2fff'], cerco:['CERCO', '#d33a3a'], offro:['OFFRO', '#1c9a62'], collab:['COLLAB', '#c98f00'], altro:['ALTRO', '#6a6e8a']};
function safeUrl(u){ return /^https?:\/\/[^\s]+$/i.test(u || '') ? u : ''; }

function shrink(file){ return new Promise(function(res, rej){ var img = new Image(), url = URL.createObjectURL(file); img.onload = function(){ var sc = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(function(b){ b ? res(b) : rej(); }, 'image/jpeg', .82); }; img.onerror = function(){ rej(); }; img.src = url; }); }
var PERR = {rate:'Hai già affisso 3 fogli oggi: riprova domani.', bad_link:'Il link deve iniziare con http:// o https://', bad_text:'Titolo e messaggio sono obbligatori.', login:'Entra per affiggere un foglio.', no_profile:'Completa prima il tuo profilo.', bad_image:'Immagine non valida.'};
function openBoard(){
  if(!ME.ready){ toast('🔒 La bacheca è riservata agli iscritti: entra dal sito.'); return; }
  modal('<h4>BACHECA</h4><p>Promuovi la tua musica, cerca o offri una mano, trova chi collabora.</p><div id="cork" class="cork"></div><div class="wmsg" id="pMsg"></div><details id="pDet"><summary>Affiggi un foglio</summary><form id="pForm"><label>Di cosa si tratta<select id="pKind"><option value="promo">Promo · ascolta la mia musica</option><option value="cerco">Cerco · mi serve qualcuno</option><option value="offro">Offro · mi propongo</option><option value="collab">Collab · facciamo qualcosa insieme</option><option value="altro">Altro</option></select></label><label>Titolo<input id="pTitle" maxlength="60" required></label><label>Messaggio<textarea id="pBody" maxlength="400" rows="4" required></textarea></label><label>Link (facoltativo)<input id="pLink" type="url" placeholder="https://"></label><label>Immagine (facoltativa)<input id="pImg" type="file" accept="image/*"></label><button class="go" type="submit">AFFIGGI</button></form></details>', function(ov, close){
    ov.querySelector('.card').classList.add('wide');
    var cork = ov.querySelector('#cork'), pm = ov.querySelector('#pMsg');
    async function load(){

        var r = await sb.rpc('board_list'); if(r.error || !r.data) return; cork.innerHTML = '';
        if(!r.data.length){ cork.innerHTML = '<div class="empty">La lavagna è vuota. Lascia un post-it!</div>'; return; }
        r.data.forEach(function(n){
          var c = document.createElement('div'); c.className = 'note'; c.style.transform = 'rotate(' + ((((n.id * 37) % 9) - 4) * .6) + 'deg)'; var k = KIND[n.kind] || KIND.altro;
          c.innerHTML = '<span class="nk" style="background:' + k[1] + '">' + k[0] + '</span><h5></h5><p></p>'; c.querySelector('h5').textContent = n.title; c.querySelector('p').textContent = n.body;
          if(n.image_path){ var im = document.createElement('img'); im.alt = ''; im.loading = 'lazy'; im.src = sb.storage.from('board').getPublicUrl(n.image_path).data.publicUrl; c.appendChild(im); }
          var lk = safeUrl(n.link); if(lk){ var an = document.createElement('a'); an.href = lk; an.target = '_blank'; an.rel = 'noopener noreferrer nofollow ugc'; an.textContent = '↗ ' + hostOf(lk); c.appendChild(an); }
          var f = document.createElement('div'); f.className = 'nf'; f.textContent = (n.is_owner ? '★ ' : '') + '— ' + n.nick;
          if(n.mine){ var x = document.createElement('button'); x.type = 'button'; x.textContent = 'stacca'; x.addEventListener('click', async function(){ if(x.dataset.sure !== '1'){ x.dataset.sure = '1'; x.textContent = 'sicuro?'; return; } try{ await sb.rpc('board_delete_mine', {p_id:n.id}); if(n.image_path) await sb.storage.from('board').remove([n.image_path]); }catch(e){} load(); }); f.appendChild(x); }
          c.appendChild(f); cork.appendChild(c);

      }catch(e){}
    }
    load();
    ov.querySelector('#pForm').addEventListener('submit', async function(e){
      e.preventDefault(); var pf = e.target, go = pf.querySelector('.go'); go.disabled = true; pm.textContent = 'Affisso in corso…';

        var path = null, fl = ov.querySelector('#pImg').files[0];

        var r = await sb.rpc('board_post', {p_kind:ov.querySelector('#pKind').value, p_title:ov.querySelector('#pTitle').value, p_body:ov.querySelector('#pBody').value, p_link:ov.querySelector('#pLink').value, p_image_path:path});
        if(r.error || r.data !== 'ok'){ pm.textContent = PERR[r.data] || 'Non sono riuscito ad affiggere il foglio, riprova.'; if(path) sb.storage.from('board').remove([path]); } else { pf.reset(); pm.textContent = ''; ov.querySelector('#pDet').open = false; load(); }
      }catch(err){ pm.textContent = 'Non sono riuscito ad affiggere il foglio, riprova.'; }

var WHEEL = [10, 5, 20, 15, 10, 50, 5, 100], WCOL = ['#7b2fff', '#17b36b', '#d6307e', '#2f7fd8', '#9a5fe0', '#e0742a', '#17b36b', '#d4af37'], wheelUsed = false;
function wheelDay(){ return new Date().toLocaleDateString('en-CA', {timeZone:'Europe/Rome'}); }
function openWheel(){
  modal('<h4>RUOTA DELLA FORTUNA</h4><p>Un giro al giorno. Puoi vincere fino a 100 monete.</p><canvas id="whC" width="300" height="300" style="display:block;margin:0 auto 12px;max-width:100%"></canvas><div class="wmsg" id="whMsg"></div><button type="button" class="go" id="whGo">GIRA!</button>', function(ov, close){
    var cvx = ov.querySelector('#whC'), cx = cvx.getContext('2d'), msg = ov.querySelector('#whMsg'), go = ov.querySelector('#whGo'), busy = false;
    function draw(deg){
      cx.clearRect(0, 0, 300, 300); cx.save(); cx.translate(150, 158); cx.beginPath(); cx.arc(0, 0, 138, 0, 6.2832); cx.fillStyle = '#d4af37'; cx.fill(); cx.rotate(deg * Math.PI / 180);
      for(var k = 0; k < 8; k++){ var a0 = (k * 45 - 90) * Math.PI / 180, a1 = ((k + 1) * 45 - 90) * Math.PI / 180; cx.beginPath(); cx.moveTo(0, 0); cx.arc(0, 0, 128, a0, a1); cx.closePath(); cx.fillStyle = WCOL[k]; cx.fill(); cx.strokeStyle = '#0a0414'; cx.lineWidth = 2; cx.stroke(); cx.save(); cx.rotate((k + .5) * 45 * Math.PI / 180); cx.fillStyle = k === 7 ? '#2a1a00' : '#fff'; cx.font = '800 20px "Space Grotesk",sans-serif'; cx.textAlign = 'center'; cx.fillText(String(WHEEL[k]), 0, -88); cx.restore(); }
      cx.beginPath(); cx.arc(0, 0, 18, 0, 6.2832); cx.fillStyle = '#0a0414'; cx.fill(); cx.strokeStyle = '#d4af37'; cx.lineWidth = 4; cx.stroke(); cx.restore();
      for(var b = 0; b < 16; b++){ var ba = b * 22.5 * Math.PI / 180; cx.beginPath(); cx.arc(150 + Math.sin(ba) * 134, 158 - Math.cos(ba) * 134, 3.4, 0, 6.2832); cx.fillStyle = b % 2 ? '#fff7c0' : '#ff8a3d'; cx.fill(); }
      cx.beginPath(); cx.moveTo(150, 36); cx.lineTo(139, 8); cx.lineTo(161, 8); cx.closePath(); cx.fillStyle = '#ff3b3b'; cx.fill(); cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.stroke();
    }
    function rest(slot){ return 360 * 6 - (slot + .5) * 45; }
    function spinTo(slot, done){ var tgt = rest(slot) + (Math.random() - .5) * 24, t0 = performance.now(), D = 4800; (function step(now){ var p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 4); draw(tgt * e); if(p < 1) requestAnimationFrame(step); else done(); })(t0); }
    function lock(t){ go.disabled = true; go.textContent = t; }
    draw(0);
    if(!ME.ready){ msg.textContent = 'Accedi dal sito per girare la ruota.'; lock('ACCEDI'); return; }
    sb.from('wheel_spins').select('slot,prize').eq('day', wheelDay()).maybeSingle().then(function(q){ if(q && q.data){ wheelUsed = true; draw(rest(q.data.slot)); msg.textContent = 'Oggi hai già girato: +' + q.data.prize + ' 🪙. Torna domani!'; lock('TORNA DOMANI'); } });
    go.addEventListener('click', async function(){
      if(busy || go.disabled) return; busy = true; go.disabled = true; msg.textContent = ''; var r; try{ r = await sb.rpc('spin_wheel'); }catch(e){ r = {error:e}; }
      var row = r && r.data ? (Array.isArray(r.data) ? r.data[0] : r.data) : null;
      if(!row || r.error){ msg.textContent = 'Non riesco a girare adesso, riprova.'; go.disabled = false; busy = false; return; }
      if(!row.did){ wheelUsed = true; draw(rest(row.slot)); msg.textContent = 'Oggi hai già girato. Torna domani!'; lock('TORNA DOMANI'); busy = false; return; }
      spinTo(row.slot, function(){ wheelUsed = true; msg.textContent = '+' + row.got + ' 🪙  Totale: ' + row.total_coins; lock('TORNA DOMANI'); busy = false; $('coins').textContent = row.total_coins; toast('🎉 Hai vinto ' + row.got + ' monete!'); });
    });
  });
}

var cs = {yaw:.55, pitch:.62, dist:15, tyaw:.55, tpitch:.62, tdist:15};
function size(){ var w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', size); size();
var drag = null, moved = 0, cv2 = $('c');
cv2.addEventListener('pointerdown', function(e){ drag = {x:e.clientX, y:e.clientY}; moved = 0; cv2.setPointerCapture(e.pointerId); });
cv2.addEventListener('pointermove', function(e){ if(!drag) return; var dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy); drag = {x:e.clientX, y:e.clientY}; cs.tyaw -= dx * .006; cs.tpitch = Math.min(1.45, Math.max(.2, cs.tpitch + dy * .005)); });
cv2.addEventListener('pointerup', function(e){
  var was = drag; drag = null; if(moved > 6 || !was) return;
  var rc = new THREE.Raycaster(), v = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); rc.setFromCamera(v, cam);
  var hs = rc.intersectObjects(HIT, false); if(hs.length){ goAct(hs[0].object.userData.act); return; }
  var pt = new THREE.Vector3(); if(rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -stageH(ME.x, ME.z)), pt) || rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), pt)){ pendingAct = null; walkMe(Math.min(23.5, Math.max(.5, pt.x)), Math.min(23.5, Math.max(.5, pt.z))); }
});
cv2.addEventListener('wheel', function(e){ e.preventDefault(); cs.tdist = Math.min(24, Math.max(4, cs.tdist + e.deltaY * .01)); }, {passive:false});
var keys = {}; addEventListener('keydown', function(e){ if(/INPUT|TEXTAREA/.test((e.target || {}).tagName || '')) return; var kk = e.key.toLowerCase(); if(kk.indexOf('arrow') === 0) e.preventDefault(); keys[kk] = 1; }); addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = 0; });
$('bStage').onclick = function(){ goAct('mic'); }; $('bBar').onclick = function(){ goAct('cafe'); }; $('bWheel').onclick = function(){ goAct('wheel'); };

// ---- aggiornamento di un giocatore che segue un percorso
function follow(P, dt, speed){
  if(!P.path.length) return false; var t = P.path[0], dx = t.x - P.x, dz = t.z - P.z, d = Math.hypot(dx, dz), st = speed * dt;
  if(d <= st){ P.x = t.x; P.z = t.z; P.path.shift(); } else { P.x += dx / d * st; P.z += dz / d * st; P.face = turn(P.face, Math.atan2(dx, dz), dt); }
  return true;
}
function proj(lb, A, off){ var v = new THREE.Vector3(A.g.position.x, A.g.position.y + off, A.g.position.z).project(cam); var on = v.z < 1 && Math.abs(v.x) < 1.2 && Math.abs(v.y) < 1.2; lb.el.style.display = on ? '' : 'none'; if(on) lb.el.style.transform = 'translate(-50%,-100%) translate(' + ((v.x + 1) / 2 * innerWidth).toFixed(1) + 'px,' + ((1 - v.y) / 2 * innerHeight).toFixed(1) + 'px)'; }
var clock = new THREE.Clock(), lastSent = 0;
function frame(){
  requestAnimationFrame(frame); var dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  if(ME.ready){
    var kx = (keys.arrowright ? 1 : 0) - (keys.arrowleft ? 1 : 0), kz = (keys.arrowup ? 1 : 0) - (keys.arrowdown ? 1 : 0);
    if((kx || kz) && !ME.seat){ ME.path = []; pendingAct = null; var c = Math.cos(cs.yaw), s2 = Math.sin(cs.yaw), mx = -s2 * kz + c * kx, mz = -c * kz - s2 * kx, m = Math.hypot(mx, mz); mx /= m; mz /= m; var nx = ME.x + mx * 3.2 * dt, nz = ME.z + mz * 3.2 * dt;
      if(free(Math.floor(nx), Math.floor(nz))){ ME.x = nx; ME.z = nz; } else if(free(Math.floor(nx), Math.floor(ME.z))) ME.x = nx; else if(free(Math.floor(ME.x), Math.floor(nz))) ME.z = nz; ME.face = turn(ME.face, Math.atan2(mx, mz), dt); ME.keyMoving = true; if(t - lastSent > .4 && ch){ lastSent = t; try{ ch.send({type:'broadcast', event:'walk', payload:{k:myKey, x:+ME.x.toFixed(2), y:+ME.z.toFixed(2), dx:+(ME.x + mx * 1.2).toFixed(2), dy:+(ME.z + mz * 1.2).toFixed(2)}}); }catch(e){} } }
    else ME.keyMoving = false;
    var mv = follow(ME, dt, 3.2) || ME.keyMoving;
    if(!ME.path.length && ME.goal){ ME.goal = null; trackSoon(); if(pendingAct){ var a = pendingAct; pendingAct = null; doAct(a); } }
    animAv(ME.A, mv && !ME.seat, !!ME.seat, dt, stageH(ME.x, ME.z), ME.face); ME.A.g.position.x = ME.x; ME.A.g.position.z = ME.z;
    proj(meLabel, ME.A, 2.15);
  }
  Object.keys(REM).forEach(function(k){ var r = REM[k]; var mv = follow(r, dt, 3.2); animAv(r.A, mv && !r.seat, !!r.seat, dt, stageH(r.x, r.z), r.face); r.A.g.position.x = r.x; r.A.g.position.z = r.z; proj(r.lb, r.A, 2.15); });
  var ref = ME.ready ? ME.A.g.position : new THREE.Vector3(12, 0, 12), a = 1 - Math.pow(.0005, dt); cs.yaw += (cs.tyaw - cs.yaw) * a; cs.pitch += (cs.tpitch - cs.pitch) * a; cs.dist += (cs.tdist - cs.dist) * a;
  var fy = ref.y + 1.1; cam.position.set(ref.x + Math.sin(cs.yaw) * Math.cos(cs.pitch) * cs.dist, fy + Math.sin(cs.pitch) * cs.dist, ref.z + Math.cos(cs.yaw) * Math.cos(cs.pitch) * cs.dist); cam.lookAt(ref.x, fy, ref.z);
  wheelG.rotation.z = -t * (wheelUsed ? .12 : .4);
  pulse.forEach(function(g, i){ var s3 = dj.playing && !dj.muted ? 1 + .07 * Math.abs(Math.sin(t * 6.6 + i)) : 1; g.scale.set(s3, s3, 1); });
  jets.forEach(function(j, i){ var ph = (t * .9 + i * .125) % 1, an = i / jets.length * 6.283; j.position.set(11.5 + Math.cos(an) * ph * 1.2, 1.5 + Math.sin(ph * 3.14) * 1.1 - ph * .5, 12 + Math.sin(an) * ph * 1.2); });
  spots.forEach(function(s3, i){ s3.intensity = 1.4 + Math.abs(Math.sin(t * (1.6 + i * .4))) * 1.6; });
  if(window.__blink) window.__blink(t); if(window.__mast) window.__mast.visible = Math.sin(t * 10) > 0;
  renderer.render(scene, cam);
}
frame();

// ---- avvio: sessione condivisa con il sito (stesso dominio), profilo, canale
(async function(){
  if(!sb){ toast('Servizio non disponibile.'); return; }
  var ses = null; try{ var r = await sb.auth.getSession(); ses = r && r.data && r.data.session; }catch(e){}
  if(ses && ses.user){
    ME.uid = ses.user.id;
    try{ var p = await sb.from('profiles').select('nickname,avatar').eq('id', ME.uid).maybeSingle(); ME.nick = cleanNick(p && p.data && p.data.nickname); ME.av = (p && p.data && p.data.avatar) || null; }catch(e){}
    if(!ME.av){ try{ ME.av = JSON.parse(localStorage.getItem('kl_avatar') || 'null'); }catch(e){} }
    try{ var ad = await sb.rpc('is_kl_admin'); ME.owner = !!(ad && ad.data === true); }catch(e){}
    try{ var w = await sb.from('wallets').select('coins').eq('user_id', ME.uid).maybeSingle(); if(w && w.data) $('coins').textContent = w.data.coins; }catch(e){}
    ME.ready = !!ME.nick && ME.nick !== '?'; dressAv(ME.A, ME.av, ME.owner);
  }
  if(ME.ready){ meLabel = {el:mkLabel(ME.nick, ME.owner), bt:0}; $('who').textContent = ME.nick; $('coinbox').hidden = false; $('chat').hidden = false; ME.A.g.position.set(ME.x, 0, ME.z); }
  else { scene.remove(ME.A.g); $('guest').hidden = false; }
  window.kl3d = {cs:cs, ME:ME, goAct:goAct, doAct:doAct};
  joinChannel(); djPull(); setInterval(djPull, 20000);

})();
})();
