.right{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}

  c.on('presence', {event:'sync'}, syncPresence);
  c.on('broadcast', {event:'walk'}, function(m){ var p = m.payload; if(!p) return; var r = REM[p.k]; if(!r) return; if(Math.hypot(r.x - p.x, r.z - p.y) > 1.6){ r.x = +p.x; r.z = +p.y; } r.seat = null; r.path = findPath({x:r.x, z:r.z}, {x:+p.dx, z:+p.dy}); });
  c.on('broadcast', {event:'say'}, function(m){ var p = m.payload; if(!p) return; var r = REM[p.k]; var body = String(p.body || '').slice(0, 140); if(r) bubble(r.lb, body); addLog(cleanNick(p.nick), body, !!p.own); });
  c.on('broadcast', {event:'ann'}, function(m){ onAnn(m.payload); });
  c.on('broadcast', {event:'dj'}, function(){ djPull(); });
  c.subscribe(function(s2){ if(s2 === 'SUBSCRIBED') trackMe(); }); ch = c;
}
function addLog(nick, text, own){ var b = $('log'); var d = document.createElement('div'); d.innerHTML = '<b' + (own ? ' class="own"' : '') + '>' + esc(nick) + '</b> ' + esc(text); b.appendChild(d); while(b.children.length > 6) b.removeChild(b.firstChild); setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 30000); }
function onAnn(p){ if(!p) return; var t = String(p.body || '').slice(0, 160); if(!t) return; var b = $('banner'); b.textContent = '📣 ' + cleanNick(p.nick) + ': ' + t; b.classList.add('on'); clearTimeout(b._t); b._t = setTimeout(function(){ b.classList.remove('on'); }, 9000); }

// ---- chat in gioco (collegata a CHATLAND)
var GERR = {rate:'Piano piano…', banned:'Non puoi scrivere.', login:'Entra per scrivere.', bad_body:'Messaggio non valido.', no_profile:'Completa il profilo.'}, lastSay = 0;
$('chat').addEventListener('submit', async function(e){
  e.preventDefault(); var inp = $('msg'), body = inp.value.trim(); if(!body || !ME.ready || !ch) return; if(Date.now() - lastSay < 900) return; lastSay = Date.now(); inp.value = '';
  try{ var r = await sb.rpc('chat_post', {p_nick:'', p_body:body, p_device:dev, p_place:'piazza', p_src:'game'}); if(r.error || r.data !== 'ok'){ toast(GERR[r.data] || 'Non sono riuscito a inviare.'); return; } }catch(err){ toast('Non sono riuscito a inviare.'); return; }
  body = body.slice(0, 140); try{ ch.send({type:'broadcast', event:'say', payload:{k:myKey, nick:ME.nick, body:body, own:ME.owner}}); }catch(err){} bubble(meLabel, body); addLog(ME.nick, body, ME.owner);
});

// ---- DJ della piazza
var audio = new Audio(); audio.preload = 'auto'; audio.loop = true; audio.crossOrigin = 'anonymous'; audio.volume = .85;
var dj = {muted:false, playing:false, title:''};
function djUi(){ var b = $('snd'); b.textContent = (dj.muted || !dj.playing) ? '🔇' : '🔊'; }
function djApply(row){
  dj.title = row.title || ''; var url = row.url || ''; if(!row.playing || !url){ dj.playing = false; audio.pause(); djUi(); return; } dj.playing = true;
  if(audio.getAttribute('data-u') !== url){ audio.setAttribute('data-u', url); audio.src = url; }
  var seek = function(){ var d = audio.duration, t = Number(row.pos) || 0; if(isFinite(d) && d > 0) t = t % d; try{ if(Math.abs(audio.currentTime - t) > 2.5) audio.currentTime = t; }catch(e){} };
  if(audio.readyState >= 1) seek(); else audio.addEventListener('loadedmetadata', seek, {once:true});
  audio.muted = dj.muted; var pr = audio.play(); if(pr && pr.catch) pr.catch(function(){ dj.muted = true; djUi(); }); djUi();
}
async function djPull(){ try{ var r = await sb.rpc('dj_state'); var row = r && r.data && r.data[0]; if(row) djApply(row); }catch(e){} }
$('snd').addEventListener('click', function(){ dj.muted = !dj.muted; audio.muted = dj.muted; if(!dj.muted && dj.playing){ var pr = audio.play(); if(pr && pr.catch) pr.catch(function(){}); } djUi(); });

// ---- finestre: microfono e ruota della fortuna
function modal(html, onMount){ var ov = document.createElement('div'); ov.className = 'mod'; ov.innerHTML = '<div class="card"><button type="button" class="x" aria-label="Chiudi">✕</button>' + html + '</div>'; document.body.appendChild(ov); function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); } ov.querySelector('.x').addEventListener('click', close); ov.addEventListener('click', function(e){ if(e.target === ov) close(); }); onMount(ov, close); }
function openMic(){
  modal('<h4>MICROFONO</h4><p>Il tuo messaggio compare su tutta la piazza per qualche secondo.</p><textarea id="micTxt" maxlength="140" rows="3" placeholder="Annuncio per la piazza…"></textarea><div class="wmsg" id="micMsg"></div><button type="button" class="go" id="micGo">ANNUNCIA</button>', function(ov, close){
    ov.querySelector('#micGo').addEventListener('click', async function(){
      var body = ov.querySelector('#micTxt').value.trim(); if(!body) return; var msg = ov.querySelector('#micMsg'); msg.textContent = '';
      try{ var r = await sb.rpc('chat_post', {p_nick:'', p_body:'📣 ' + body, p_device:dev, p_place:'piazza', p_src:'game'}); if(r.error || r.data !== 'ok'){ msg.textContent = GERR[r.data] || 'Non sono riuscito a inviare.'; return; } }catch(e){ msg.textContent = 'Non sono riuscito a inviare.'; return; }
      try{ ch.send({type:'broadcast', event:'ann', payload:{nick:ME.nick, body:body, own:ME.owner}}); }catch(e){} onAnn({nick:ME.nick, body:body, own:ME.owner}); close();
    });
  });
}
var WHEEL = [10, 5, 20, 15, 10, 50, 5, 100], WCOL = ['#7b2fff', '#17b36b', '#d6307e', '#2f7fd8', '#9a5fe0', '#e0742a', '#17b36b', '#d4af37'], wheelUsed = false;
function wheelDay(){ return new Date().toLocaleDateString('en-CA', {timeZone:'Europe/Rome'}); }
function openWheel(){
  modal('<h4>RUOTA DELLA FORTUNA</h4><p>Un giro al giorno. Puoi vincere fino a 100 monete.</p><canvas id="whC" width="300" height="300" style="display:block;margin:0 auto 12px;max-width:100%"></canvas><div class="wmsg" id="whMsg"></div><button type="button" class="go" id="whGo">GIRA!</button>', function(ov, close){
    var cvx = ov.querySelector('#whC'), cx = cvx.getContext('2d'), msg = ov.querySelector('#whMsg'), go = ov.querySelector('#whGo'), busy = false;
    function draw(deg){
      cx.clearRect(0, 0, 300, 300); cx.save(); cx.translate(150, 158); cx.beginPath(); cx.arc(0, 0, 138, 0, 6.2832); cx.fillStyle = '#d4af37'; cx.fill(); cx.rotate(deg * Math.PI / 180);
      for(var k = 0; k < 8; k++){ var a0 = (k * 45 - 90) * Math.PI / 180, a1 = ((k + 1) * 45 - 90) * Math.PI / 180; cx.beginPath(); cx.moveTo(0, 0); cx.arc(0, 0, 128, a0, a1); cx.closePath(); cx.fillStyle = WCOL[k]; cx.fill(); cx.strokeStyle = '#0a0414'; cx.lineWidth = 2; cx.stroke(); cx.save(); cx.rotate((k + .5) * 45 * Math.PI / 180); cx.fillStyle = k === 7 ? '#2a1a00' : '#fff'; cx.font = '800 20px "Space Grotesk",sans-serif'; cx.textAlign = 'center'; cx.fillText(String(WHEEL[k]), 0, -88); cx.restore(); }
      cx.beginPath(); cx.arc(0, 0, 18, 0, 6.2832); cx.fillStyle = '#0a0414'; cx.fill(); cx.strokeStyle = '#d4af37'; cx.lineWidth = 4; cx.stroke(); cx.restore();
      for(var b = 0; b < 16; b++){ var ba = b * 22.5 * Math.PI / 180; cx.beginPath(); cx.arc(150 + Math.sin(ba) * 134, 158 - Math.cos(ba) * 134, 3.4, 0, 6.2832); cx.fillStyle = b % 2 ? '#fff7c0' : '#ff8a3d'; cx.fill(); }
      cx.beginPath(); cx.moveTo(150, 36); cx.lineTo(139, 8); cx.lineTo(161, 8); cx.closePath(); cx.fillStyle = '#ff3b3b'; cx.fill(); cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.stroke();
    }
    function rest(slot){ return 360 * 6 - (slot + .5) * 45; }
    function spinTo(slot, done){ var tgt = rest(slot) + (Math.random() - .5) * 24, t0 = performance.now(), D = 4800; (function step(now){ var p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 4); draw(tgt * e); if(p < 1) requestAnimationFrame(step); else done(); })(t0); }
    function lock(t){ go.disabled = true; go.textContent = t; }
    draw(0);
    if(!ME.ready){ msg.textContent = 'Accedi dal sito per girare la ruota.'; lock('ACCEDI'); return; }
    sb.from('wheel_spins').select('slot,prize').eq('day', wheelDay()).maybeSingle().then(function(q){ if(q && q.data){ wheelUsed = true; draw(rest(q.data.slot)); msg.textContent = 'Oggi hai già girato: +' + q.data.prize + ' 🪙. Torna domani!'; lock('TORNA DOMANI'); } });
    go.addEventListener('click', async function(){
      if(busy || go.disabled) return; busy = true; go.disabled = true; msg.textContent = ''; var r; try{ r = await sb.rpc('spin_wheel'); }catch(e){ r = {error:e}; }
      var row = r && r.data ? (Array.isArray(r.data) ? r.data[0] : r.data) : null;
      if(!row || r.error){ msg.textContent = 'Non riesco a girare adesso, riprova.'; go.disabled = false; busy = false; return; }
      if(!row.did){ wheelUsed = true; draw(rest(row.slot)); msg.textContent = 'Oggi hai già girato. Torna domani!'; lock('TORNA DOMANI'); busy = false; return; }
      spinTo(row.slot, function(){ wheelUsed = true; msg.textContent = '+' + row.got + ' 🪙  Totale: ' + row.total_coins; lock('TORNA DOMANI'); busy = false; $('coins').textContent = row.total_coins; toast('🎉 Hai vinto ' + row.got + ' monete!'); });
    });
  });
}

// ---- camera e input
var cs = {yaw:.55, pitch:.62, dist:15, tyaw:.55, tpitch:.62, tdist:15};
function size(){ var w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', size); size();
var drag = null, moved = 0, cv2 = $('c');
cv2.addEventListener('pointerdown', function(e){ drag = {x:e.clientX, y:e.clientY}; moved = 0; cv2.setPointerCapture(e.pointerId); });
cv2.addEventListener('pointermove', function(e){ if(!drag) return; var dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy); drag = {x:e.clientX, y:e.clientY}; cs.tyaw -= dx * .006; cs.tpitch = Math.min(1.45, Math.max(.2, cs.tpitch + dy * .005)); });
cv2.addEventListener('pointerup', function(e){
  var was = drag; drag = null; if(moved > 6 || !was) return;
  var rc = new THREE.Raycaster(), v = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); rc.setFromCamera(v, cam);
  var hs = rc.intersectObjects(HIT, false); if(hs.length){ goAct(hs[0].object.userData.act); return; }
  var pt = new THREE.Vector3(); if(rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -stageH(ME.x, ME.z)), pt) || rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), pt)){ pendingAct = null; walkMe(Math.min(23.5, Math.max(.5, pt.x)), Math.min(23.5, Math.max(.5, pt.z))); }
});
cv2.addEventListener('wheel', function(e){ e.preventDefault(); cs.tdist = Math.min(24, Math.max(4, cs.tdist + e.deltaY * .01)); }, {passive:false});
var keys = {}; addEventListener('keydown', function(e){ if(/INPUT|TEXTAREA/.test((e.target || {}).tagName || '')) return; keys[e.key.toLowerCase()] = 1; }); addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = 0; });
$('bStage').onclick = function(){ goAct('mic'); }; $('bBar').onclick = function(){ goAct('cafe'); }; $('bWheel').onclick = function(){ goAct('wheel'); }; $('bTop').onclick = function(){ cs.tpitch = 1.45; cs.tdist = 22; };

// ---- aggiornamento di un giocatore che segue un percorso
function follow(P, dt, speed){
  if(!P.path.length) return false; var t = P.path[0], dx = t.x - P.x, dz = t.z - P.z, d = Math.hypot(dx, dz), st = speed * dt;
  if(d <= st){ P.x = t.x; P.z = t.z; P.path.shift(); } else { P.x += dx / d * st; P.z += dz / d * st; P.face = turn(P.face, Math.atan2(dx, dz), dt); }
  return true;
}
function proj(lb, A, off){ var v = new THREE.Vector3(A.g.position.x, A.g.position.y + off, A.g.position.z).project(cam); var on = v.z < 1 && Math.abs(v.x) < 1.2 && Math.abs(v.y) < 1.2; lb.el.style.display = on ? '' : 'none'; if(on) lb.el.style.transform = 'translate(-50%,-100%) translate(' + ((v.x + 1) / 2 * innerWidth).toFixed(1) + 'px,' + ((1 - v.y) / 2 * innerHeight).toFixed(1) + 'px)'; }
var clock = new THREE.Clock(), lastSent = 0;
function frame(){
  requestAnimationFrame(frame); var dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  if(ME.ready){
    var kx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0), kz = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
    if((kx || kz) && !ME.seat){ ME.path = []; pendingAct = null; var c = Math.cos(cs.yaw), s2 = Math.sin(cs.yaw), mx = -s2 * kz + c * kx, mz = -c * kz - s2 * kx, m = Math.hypot(mx, mz); mx /= m; mz /= m; var nx = ME.x + mx * 3.2 * dt, nz = ME.z + mz * 3.2 * dt;
      if(free(Math.floor(nx), Math.floor(nz))){ ME.x = nx; ME.z = nz; } else if(free(Math.floor(nx), Math.floor(ME.z))) ME.x = nx; else if(free(Math.floor(ME.x), Math.floor(nz))) ME.z = nz; ME.face = turn(ME.face, Math.atan2(mx, mz), dt); ME.keyMoving = true; if(t - lastSent > .4 && ch){ lastSent = t; try{ ch.send({type:'broadcast', event:'walk', payload:{k:myKey, x:+ME.x.toFixed(2), y:+ME.z.toFixed(2), dx:+(ME.x + mx * 1.2).toFixed(2), dy:+(ME.z + mz * 1.2).toFixed(2)}}); }catch(e){} } }
    else ME.keyMoving = false;
    var mv = follow(ME, dt, 3.2) || ME.keyMoving;
    if(!ME.path.length && ME.goal){ ME.goal = null; trackSoon(); if(pendingAct){ var a = pendingAct; pendingAct = null; doAct(a); } }
    animAv(ME.A, mv && !ME.seat, !!ME.seat, dt, stageH(ME.x, ME.z), ME.face); ME.A.g.position.x = ME.x; ME.A.g.position.z = ME.z;
    proj(meLabel, ME.A, 2.15);
  }
  Object.keys(REM).forEach(function(k){ var r = REM[k]; var mv = follow(r, dt, 3.2); animAv(r.A, mv && !r.seat, !!r.seat, dt, stageH(r.x, r.z), r.face); r.A.g.position.x = r.x; r.A.g.position.z = r.z; proj(r.lb, r.A, 2.15); });
  var ref = ME.ready ? ME.A.g.position : new THREE.Vector3(12, 0, 12), a = 1 - Math.pow(.0005, dt); cs.yaw += (cs.tyaw - cs.yaw) * a; cs.pitch += (cs.tpitch - cs.pitch) * a; cs.dist += (cs.tdist - cs.dist) * a;
  var fy = ref.y + 1.1; cam.position.set(ref.x + Math.sin(cs.yaw) * Math.cos(cs.pitch) * cs.dist, fy + Math.sin(cs.pitch) * cs.dist, ref.z + Math.cos(cs.yaw) * Math.cos(cs.pitch) * cs.dist); cam.lookAt(ref.x, fy, ref.z);
  wheelG.rotation.z = -t * (wheelUsed ? .12 : .4);
  pulse.forEach(function(g, i){ var s3 = dj.playing && !dj.muted ? 1 + .07 * Math.abs(Math.sin(t * 6.6 + i)) : 1; g.scale.set(s3, s3, 1); });
  jets.forEach(function(j, i){ var ph = (t * .9 + i * .125) % 1, an = i / jets.length * 6.283; j.position.set(11.5 + Math.cos(an) * ph * 1.2, 1.5 + Math.sin(ph * 3.14) * 1.1 - ph * .5, 12 + Math.sin(an) * ph * 1.2); });
  spots.forEach(function(s3, i){ s3.intensity = 1.4 + Math.abs(Math.sin(t * (1.6 + i * .4))) * 1.6; });
  renderer.render(scene, cam);
}
frame();

// ---- avvio: sessione condivisa con il sito (stesso dominio), profilo, canale
(async function(){
  if(!sb){ toast('Servizio non disponibile.'); return; }
  var ses = null; try{ var r = await sb.auth.getSession(); ses = r && r.data && r.data.session; }catch(e){}
  if(ses && ses.user){
    ME.uid = ses.user.id;
    try{ var p = await sb.from('profiles').select('nickname').eq('id', ME.uid).maybeSingle(); ME.nick = cleanNick(p && p.data && p.data.nickname); }catch(e){}
    try{ var ad = await sb.rpc('is_kl_admin'); ME.owner = !!(ad && ad.data === true); }catch(e){}
    try{ var w = await sb.from('wallets').select('coins').eq('user_id', ME.uid).maybeSingle(); if(w && w.data) $('coins').textContent = w.data.coins; }catch(e){}
    ME.ready = !!ME.nick && ME.nick !== '?';
  }
  if(ME.ready){ meLabel = {el:mkLabel(ME.nick, ME.owner), bt:0}; $('who').textContent = ME.nick; $('coinbox').hidden = false; $('chat').hidden = false; ME.A.g.position.set(ME.x, 0, ME.z); }
  else { scene.remove(ME.A.g); $('guest').hidden = false; }
  joinChannel(); djPull(); setInterval(djPull, 20000);
  try{ var q = await sb.from('wheel_spins').select('slot').eq('day', wheelDay()).maybeSingle(); wheelUsed = !!(q && q.data); }catch(e){}
})();
})();
